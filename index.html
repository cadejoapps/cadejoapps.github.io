<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="Bienvenidos a CadejoApps. Aplicaciones creadas con atención al detalle.">
  <title>Bienvenidos | CadejoApps</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080808;
      --panel: #111111;
      --text: #f5f5f5;
      --muted: #b5b5b5;
      --red: #ff3038;
      --line: #292929;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(ellipse at 50% 20%, #191919 0%, var(--bg) 58%);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
    }
    header {
      width: min(100% - 2rem, 1100px);
      margin: 0 auto;
      padding: 1.25rem 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }
    .brand {
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: -.04em;
    }
    .brand span { color: var(--red); }
    .tag {
      color: var(--muted);
      font-size: .82rem;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    main {
      flex: 1;
      width: min(100% - 2rem, 900px);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 3rem 0 4rem;
    }
    .logo {
      display: block;
      width: min(100%, 460px);
      height: auto;
      border-radius: 18px;
      margin-bottom: 2rem;
      box-shadow: 0 18px 65px rgba(0, 0, 0, .35);
    }
    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 7vw, 4rem);
      line-height: 1.08;
      letter-spacing: -.055em;
    }
    h1 span { color: var(--red); }
    .intro {
      max-width: 560px;
      margin: 1.15rem auto 2rem;
      color: var(--muted);
      font-size: clamp(1rem, 2.5vw, 1.15rem);
      line-height: 1.7;
    }
    .links {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: .8rem;
    }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: .85rem 1.2rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--text);
      text-decoration: none;
      font-weight: 650;
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
    }
    .button:hover { transform: translateY(-2px); border-color: #555; }
    .button.primary {
      background: var(--red);
      border-color: var(--red);
      color: #fff;
    }
    .button.primary:hover { background: #e92730; border-color: #e92730; }
    footer {
      border-top: 1px solid var(--line);
      padding: 1.25rem 1rem;
      text-align: center;
      color: #888;
      font-size: .85rem;
    }
    footer strong { color: #ccc; }
    a:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
    @media (max-width: 520px) {
      header { padding: 1rem 0; }
      .tag { font-size: .68rem; letter-spacing: .08em; }
      main { padding: 2rem 0 3rem; }
      .logo { width: min(100%, 340px); margin-bottom: 1.6rem; }
      .links { width: 100%; flex-direction: column; }
      .button { width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
